name: Checkpoint Verification Runner

on:
  schedule:
    # Run every 30 minutes to verify Jewels progress
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.checkpoints/**'
      - 'repair/versail-deployment-*'

jobs:
  verify_checkpoints:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read CHECKPOINTS.md
        id: checkpoints
        run: |
          if [ -f "CHECKPOINTS.md" ]; then
            echo "checkpoints_found=true" >> $GITHUB_OUTPUT
            echo "checkpoints_content<<EOF" >> $GITHUB_OUTPUT
            cat CHECKPOINTS.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "checkpoints_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify Instruction Set 1
        id: verify_is1
        run: |
          ISSUES=""
          
          # Check 1.1: Source extraction
          if ! git ls-files DARCH-prima.zip > /dev/null 2>&1; then
            ISSUES="$ISSUES\n- DISCREPANCY_MISSING_SOURCE: DARCH-prima.zip not found"
          fi
          
          # Check 1.3: Dependencies
          if [ ! -d "node_modules" ]; then
            ISSUES="$ISSUES\n- DISCREPANCY_INSTALL_FAILED: node_modules not found"
          fi
          
          # Check 1.4: Build files
          if [ ! -f ".checkpoints/1_4_build_log.txt" ] && [ ! -d "dist" ]; then
            ISSUES="$ISSUES\n- DISCREPANCY_BUILD_FAILED: No build output found"
          fi
          
          if [ -z "$ISSUES" ]; then
            echo "is1_status=PASS" >> $GITHUB_OUTPUT
          else
            echo "is1_status=FAIL" >> $GITHUB_OUTPUT
            echo "is1_issues<<EOF" >> $GITHUB_OUTPUT
            echo -e "$ISSUES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Verify Instruction Set 2
        id: verify_is2
        run: |
          ISSUES=""
          
          # Check 2.1: Defect inventory
          if [ ! -f ".checkpoints/2_1_defect_inventory.md" ]; then
            ISSUES="$ISSUES\n- DISCREPANCY_INCOMPLETE_DEFECT_LIST: Inventory missing"
          fi
          
          # Check 2.4: Repairs
          if [ ! -f ".checkpoints/2_4_repairs_log.md" ]; then
            ISSUES="$ISSUES\n- DISCREPANCY_REPAIR_INCOMPLETE: Repairs log missing"
          fi
          
          if [ -z "$ISSUES" ]; then
            echo "is2_status=PASS" >> $GITHUB_OUTPUT
          else
            echo "is2_status=FAIL" >> $GITHUB_OUTPUT
            echo "is2_issues<<EOF" >> $GITHUB_OUTPUT
            echo -e "$ISSUES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Verify Instruction Set 3
        id: verify_is3
        run: |
          ISSUES=""
          
          # Check 3.2: Branch pushed
          REPAIR_BRANCH=$(git branch -r | grep "repair/versail-deployment" | head -1)
          if [ -z "$REPAIR_BRANCH" ]; then
            ISSUES="$ISSUES\n- DISCREPANCY_PUSH_FAILED: No repair branch found in remote"
          else
            echo "repair_branch=$REPAIR_BRANCH" >> $GITHUB_OUTPUT
          fi
          
          # Check 3.3: PR exists
          PR_NUMBER=$(gh pr list --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$PR_NUMBER" ]; then
            ISSUES="$ISSUES\n- DISCREPANCY_PR_NOT_UPDATED: No open PR found"
          else
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          fi
          
          if [ -z "$ISSUES" ]; then
            echo "is3_status=PASS" >> $GITHUB_OUTPUT
          else
            echo "is3_status=FAIL" >> $GITHUB_OUTPUT
            echo "is3_issues<<EOF" >> $GITHUB_OUTPUT
            echo -e "$ISSUES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Instruction Set 4
        id: verify_is4
        run: |
          ISSUES=""
          
          # Check 4.1: Handoff receipt
          if [ ! -f ".checkpoints/4_1_receipt_posted.txt" ]; then
            ISSUES="$ISSUES\n- DISCREPANCY_RECEIPT_MISSING: Receipt not found"
          fi
          
          # Check 4.2: Checklist
          if [ ! -f ".checkpoints/4_2_checklist.md" ]; then
            ISSUES="$ISSUES\n- DISCREPANCY_CHECKLIST_INCOMPLETE: Checklist not found"
          fi
          
          if [ -z "$ISSUES" ]; then
            echo "is4_status=PASS" >> $GITHUB_OUTPUT
          else
            echo "is4_status=FAIL" >> $GITHUB_OUTPUT
            echo "is4_issues<<EOF" >> $GITHUB_OUTPUT
            echo -e "$ISSUES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Generate Verification Report
        id: report
        run: |
          {
            echo "# VDarchP Checkpoint Verification Report"
            echo "**Generated:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "## Status Summary"
            echo "- Instruction Set 1: ${{ steps.verify_is1.outputs.is1_status }}"
            echo "- Instruction Set 2: ${{ steps.verify_is2.outputs.is2_status }}"
            echo "- Instruction Set 3: ${{ steps.verify_is3.outputs.is3_status }}"
            echo "- Instruction Set 4: ${{ steps.verify_is4.outputs.is4_status }}"
            echo ""
            
            if [ "${{ steps.verify_is1.outputs.is1_status }}" = "FAIL" ]; then
              echo "## ⚠️ Issues Found in Instruction Set 1"
              echo "${{ steps.verify_is1.outputs.is1_issues }}"
              echo ""
            fi
            
            if [ "${{ steps.verify_is2.outputs.is2_status }}" = "FAIL" ]; then
              echo "## ⚠️ Issues Found in Instruction Set 2"
              echo "${{ steps.verify_is2.outputs.is2_issues }}"
              echo ""
            fi
            
            if [ "${{ steps.verify_is3.outputs.is3_status }}" = "FAIL" ]; then
              echo "## ⚠️ Issues Found in Instruction Set 3"
              echo "${{ steps.verify_is3.outputs.is3_issues }}"
              echo ""
            fi
            
            if [ "${{ steps.verify_is4.outputs.is4_status }}" = "FAIL" ]; then
              echo "## ⚠️ Issues Found in Instruction Set 4"
              echo "${{ steps.verify_is4.outputs.is4_issues }}"
              echo ""
            fi
            
            if [ "${{ steps.verify_is3.outputs.repair_branch }}" != "" ]; then
              echo "## Repair Branch"
              echo "- Remote: ${{ steps.verify_is3.outputs.repair_branch }}"
              echo ""
            fi
            
            if [ "${{ steps.verify_is3.outputs.pr_number }}" != "" ]; then
              echo "## Pull Request"
              echo "- PR #${{ steps.verify_is3.outputs.pr_number }}"
              echo ""
            fi
            
            echo "## Next Steps"
            echo "If issues detected above, Jewels must loop back to the indicated checkpoint."
          } >> $GITHUB_STEP_SUMMARY

      - name: Post Verification Comment (If Issues)
        if: |
          steps.verify_is1.outputs.is1_status == 'FAIL' ||
          steps.verify_is2.outputs.is2_status == 'FAIL' ||
          steps.verify_is3.outputs.is3_status == 'FAIL' ||
          steps.verify_is4.outputs.is4_status == 'FAIL'
        uses: actions/github-script@v7
        with:
          script: |
            const report = `
## 🔍 Checkpoint Verification: Issues Detected

**Time:** ${new Date().toUTCString()}

### Instruction Set 1: ${{ steps.verify_is1.outputs.is1_status }}
${{ steps.verify_is1.outputs.is1_status == 'FAIL' ? steps.verify_is1.outputs.is1_issues : '✅ All checks pass' }}

### Instruction Set 2: ${{ steps.verify_is2.outputs.is2_status }}
${{ steps.verify_is2.outputs.is2_status == 'FAIL' ? steps.verify_is2.outputs.is2_issues : '✅ All checks pass' }}

### Instruction Set 3: ${{ steps.verify_is3.outputs.is3_status }}
${{ steps.verify_is3.outputs.is3_status == 'FAIL' ? steps.verify_is3.outputs.is3_issues : '✅ All checks pass' }}

### Instruction Set 4: ${{ steps.verify_is4.outputs.is4_status }}
${{ steps.verify_is4.outputs.is4_status == 'FAIL' ? steps.verify_is4.outputs.is4_issues : '✅ All checks pass' }}

### Action Required
@digital-Alchemy-mcmg Please review CHECKPOINTS.md and loop Jewels back to the indicated checkpoint(s).
            `;
            
            github.rest.issues.createComment({
              issue_number: 1,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

      - name: Create Loop-Back Task (If Issues)
        if: |
          steps.verify_is1.outputs.is1_status == 'FAIL' ||
          steps.verify_is2.outputs.is2_status == 'FAIL' ||
          steps.verify_is3.outputs.is3_status == 'FAIL' ||
          steps.verify_is4.outputs.is4_status == 'FAIL'
        run: |
          echo "## 🔄 Loop-Back Required"
          echo ""
          echo "Jewels must loop back to address discrepancies:"
          echo ""
          if [ "${{ steps.verify_is1.outputs.is1_status }}" = "FAIL" ]; then
            echo "- **Instruction Set 1:** ${{ steps.verify_is1.outputs.is1_issues }}"
          fi
          if [ "${{ steps.verify_is2.outputs.is2_status }}" = "FAIL" ]; then
            echo "- **Instruction Set 2:** ${{ steps.verify_is2.outputs.is2_issues }}"
          fi
          if [ "${{ steps.verify_is3.outputs.is3_status }}" = "FAIL" ]; then
            echo "- **Instruction Set 3:** ${{ steps.verify_is3.outputs.is3_issues }}"
          fi
          if [ "${{ steps.verify_is4.outputs.is4_status }}" = "FAIL" ]; then
            echo "- **Instruction Set 4:** ${{ steps.verify_is4.outputs.is4_issues }}"
          fi

      - name: Success - All Checkpoints Pass
        if: |
          steps.verify_is1.outputs.is1_status == 'PASS' &&
          steps.verify_is2.outputs.is2_status == 'PASS' &&
          steps.verify_is3.outputs.is3_status == 'PASS' &&
          steps.verify_is4.outputs.is4_status == 'PASS'
        run: |
          echo "# ✅ All Checkpoints Verified"
          echo ""
          echo "**Time:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "All instruction sets complete. Ready for merge review."
